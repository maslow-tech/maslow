packages:
  - "apps/*"
  - "apps/box/ui"
  - "packages/*"
  - "test"

# Workspace-level pnpm settings (moved from package.json's "pnpm" field,
# which pnpm 10 no longer reads).
overrides:
  js-yaml: ^4.3.1
  "brace-expansion@1": ^1.1.18
  "brace-expansion@2": ^2.1.4
  hono: ^4.12.34
  undici: ^6.28.0
  uuid: ^11.1.1
  "@hono/node-server": ^2.0.5
  "brace-expansion@5": ^5.0.9
  fast-uri: 3.1.5
  postcss: 8.5.24
  protobufjs: 7.6.5
  sharp: 0.35.0
  "tar@7": ^7.5.21

onlyBuiltDependencies:
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp

supportedArchitectures:
  os: [linux, darwin]
  cpu: [x64, arm64]
