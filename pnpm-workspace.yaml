packages:
  - "apps/*"
  - "apps/box/ui"
  - "packages/*"
  - "test"

# Workspace-level pnpm settings (moved from package.json's "pnpm" field,
# which pnpm 10 no longer reads).
overrides:
  "@hono/node-server": ^2.0.5
  "brace-expansion@5": ^5.0.8
  fast-uri: 3.1.4
  postcss: 8.5.24
  protobufjs: 7.6.5
  sharp: 0.35.0
  "tar@7": ^7.5.21

onlyBuiltDependencies:
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp

supportedArchitectures:
  os: [linux, darwin]
  cpu: [x64, arm64]
