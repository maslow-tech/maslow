# The Brain — Postgres 17 config for the box (recovery + observability
# posture). Mounted read-only into the postgres container and
# selected via `-c config_file=` (see docker-compose.yml).
#
# This is a full config file: it `include`s the packaged defaults, then pins the
# handful of settings the brain's correctness/recovery/observability posture
# depends on. Everything not set here keeps the postgres:17 default.

# Pull in the image's stock postgresql.conf first so we only override deltas.
include_if_exists = '/var/lib/postgresql/data/postgresql.conf'

# ------------------------------------------------------------------ connectivity
listen_addresses = '*'          # reachable only on the private compose network
max_connections = 100

# ================================================================== WAL + archiving
# The physical base backup + a continuous WAL archive are what make real PITR
# possible. RPO ≈ archive_timeout (~60s) for logical/operator mistakes.
wal_level = replica             # enough for archiving + pg_basebackup/PITR
max_wal_senders = 10            # base backups stream WAL

# WAL ARCHIVING IS ON, into pgBackRest (2026-07-29). It was OFF between
# 2026-07-09 and this change, and the reason is worth keeping: the ORIGINAL
# archive_command was a plain `cp` to a same-disk directory with NO cleanup and
# NO base backup, so it (a) filled the box disk unbounded and nearly wedged two
# production volumes and (b) was unrecoverable-from anyway — WAL with no base
# backup restores nothing. Turning that off was correct. It also left the fleet
# with ZERO whole-database backups, which is what this configuration fixes.
#
# What makes it safe to turn back on, and none of which was true in July:
#   - pgBackRest is actually INSTALLED in the image (deploy/postgres/Dockerfile)
#     and `archive-push` writes into a repo that has a BASE BACKUP to replay onto.
#   - Retention is enforced: the `backup` sidecar runs `pgbackrest expire` every
#     cycle, so old backups AND their dependent WAL are genuinely reclaimed.
#   - The repo is held inside a runtime-computed budget (20% of the volume).
#   - `archive-push-queue-max=4GiB` (pgbackrest.conf) is a hard fuse: a WEDGED
#     archiver drops WAL loudly instead of filling the disk.
archive_mode = on               # requires a server restart to toggle (not reload)
archive_command = 'pgbackrest --stanza=brain archive-push %p'

# Force a WAL segment to close (and archive) at least this often even when the
# box is quiet, so the recovery window (RPO) can't silently grow past ~60s.
# NB: this is also a large share of the measured ~10 GB/day of WAL — a forced
# switch writes a full 16 MB segment however little is in it. That is a
# deliberate RPO-for-bytes trade, and it is cheap only because the archive
# compresses those mostly-empty segments hard (zstd, pgbackrest.conf).
archive_timeout = 60s

# Compress WAL at the SOURCE (PG15+). Full-page images dominate this workload's
# WAL, and they compress well, so this cuts what gets written, fsynced, and
# archived for near-zero CPU on a 2-vCPU box. It is also the cheapest single
# lever on the ~10 GB/day measured above. Requires a postgres built with zstd
# (the PGDG/official images are); the integration test boots THIS FILE in the
# real image so an unsupported method fails CI, not a user's box.
wal_compression = zstd

# If the archiver ever wedges (disk full, bad command), Postgres will NOT delete
# unarchived WAL — pg_wal grows until the volume fills. Layered mitigation:
# `archive-push-queue-max` (pgbackrest.conf) caps the queue at 4 GiB and then
# drops WAL loudly; the box's read-only write-shed at ~90% (apps/box/src/
# disk-guard.ts) stops content writes; the backup sidecar refuses to add to a
# nearly-full volume; and EBS auto-grow runs OUT of band (CloudWatch→Lambda).
# See docs/runbooks/disk-and-growth.md and docs/runbooks/pitr.md.

# ================================================================== checkpoints
# Modest smoothing; a base backup + WAL replay is the recovery path, not a tight
# checkpoint window.
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9
min_wal_size = 128MB
max_wal_size = 2GB

# ================================================================== logging
# Safe-by-default logging: agent-authored content (bodies, titles, props, enum
# values) must NEVER leak to disk logs. These pins are load-bearing for the
# closed-enum egress posture; verbose logging is a gated, content-exposing
# operator action, not the default.
logging_collector = on
log_destination = 'stderr'
log_statement = 'none'                      # do not log SQL text (it embeds content)
log_parameter_max_length_on_error = 0       # never echo bind params in error logs
log_parameter_max_length = 0                # nor in duration/statement logs
log_min_error_statement = panic             # keep failing statement text out of logs
log_min_duration_statement = -1             # no slow-query statement capture (leaks content)
log_error_verbosity = default               # detail/hint are stripped at the egress layer
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
log_disconnections = on
log_checkpoints = on
log_lock_waits = on

# ================================================================== collation
# The database is initialized with the builtin C.UTF-8 locale at initdb time
# (POSTGRES_INITDB_ARGS in docker-compose.yml, matching pg-harness.ts); nothing
# to set here. Identifier-ish columns carry COLLATE "C" in the schema.
# Reindex-after-OS/glibc/ICU-upgrade is an operator procedure, run deliberately.
