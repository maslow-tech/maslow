# The Brain — pgBackRest config for the box.
#
# pgBackRest takes the PHYSICAL base backup that makes the archived WAL
# replayable → real PITR (RPO ≈ archive_timeout, ~60s) for logical/operator
# mistakes. `pg_dump -Fc` is demoted to a logical / cross-version safety net.
#
# v1 posture (locked): the repo is LOCAL, on the same EBS volume as
# PGDATA (no separate WAL volume). This bounds *logical* mistakes tightly (PITR)
# but a whole-volume loss is bounded only by the last EBS snapshot; an off-box
# copy is deferred. See docs/runbooks/pitr.md for the honest
# posture stated at every recovery touchpoint.

[global]
# Local repo on the EBS volume (same disk, by design).
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=none

# ------------------------------------------------------------------ RETENTION (the whole budget)
# Measured on the live box (2026-07-29): the DATABASE is 49 MB but WAL is being
# written at ~10 GB/day (257 GB in 28 days). So the base backup is essentially
# free and the retained WAL is the entire cost of a PITR window.
#
# That inverts the usual advice: take fulls FREQUENTLY, because each full is the
# point past which older WAL can be dropped. 12-hourly fulls × 4 retained ⇒ a
# ~48h PITR window at ~48h of retained WAL — where a weekly-full schedule would
# hold a week of it (~70 GB raw) on a 50 G volume.
#
# repo1-retention-archive is set EXPLICITLY rather than left to default so the
# WAL half of retention is a reviewed number and not an implicit one: WAL is kept
# only for the last N fulls, and expiring a full really does reclaim its WAL.
#
# The scheduler (deploy/postgres/backup-scheduler.sh) overrides BOTH on the
# command line when the repo approaches its runtime-computed budget (20% of the
# volume), stepping 4 → 3 → 2 → 1. These values are the ceiling, not the law.
repo1-retention-full=4
repo1-retention-full-type=count
repo1-retention-archive=4
repo1-retention-archive-type=full

# ------------------------------------------------------------------ THE JULY FUSE
# A wedged archiver is the fast disk-filler: Postgres will NOT recycle WAL it
# has not archived, so a broken archive_command turns into a full volume in
# days. That is not theoretical — unbounded `cp`-to-local-disk archiving nearly
# wedged two production disks in July 2026 and got archiving switched off
# fleet-wide.
#
# archive-push-queue-max is the supported fuse: once the un-archived WAL queue
# passes this size, pgBackRest tells Postgres the segment was archived, DROPS
# it, and logs an ERROR. That sacrifices the PITR window (loudly, and only after
# 4 GiB of failure) instead of the box. max_wal_size is 2 GB, so normal
# operation never comes near it.
archive-push-queue-max=4GiB

# ------------------------------------------------------------------ integrity + throughput
# NB: pgBackRest does NOT accept trailing comments on a value line — it parses
# `start-fast=y  # why` as the literal value "y  # why" and dies with
# "boolean option 'start-fast' must be 'y' or 'n'". Every comment here is
# therefore on its own line. (This file carried inline comments from the day it
# was written; because archiving was off, nothing ever executed it, and the
# first real `archive-push` would have failed on EVERY WAL segment on EVERY box.
# The integration suite now boots this exact file, which is how it was caught.)

# checkpoint immediately so a base backup starts now instead of waiting
start-fast=y
compress-type=zst
compress-level=3
# parallel workers (2 vCPU default box)
process-max=2
# decouple archive-push from the WAL writer
archive-async=y
spool-path=/var/spool/pgbackrest

# Logging: file only, and OFF stderr — pgBackRest log lines are operational, but
# keep them out of the Postgres/stderr stream the box's log-egress posture governs.
log-level-console=warn
log-level-file=detail
log-path=/var/log/pgbackrest

# ------------------------------------------------------------------ ONE-LINE FLIP TO OFF-BOX S3
# Moving off-box later is a config change, not a redesign. Swap the [global]
# repo1 block above for an S3 repo in the box owner's OWN account (their
# bucket, their KMS, least-privilege IAM) and re-run
# `pgbackrest stanza-create`:
#
#   repo1-type=s3
#   repo1-path=/brain
#   repo1-s3-bucket=<your-brain-backups>
#   repo1-s3-endpoint=s3.<region>.amazonaws.com
#   repo1-s3-region=<region>
#   repo1-s3-key-type=auto                 # use the instance role, no static keys
#   repo1-cipher-type=aes-256-cbc          # + repo1-cipher-pass via env/secret
#
# That single change closes the "whole-volume loss" residual by putting
# the base+WAL off the EBS volume.

[brain]
# The stanza = this box's cluster. `pg1-path` must match PGDATA.
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
